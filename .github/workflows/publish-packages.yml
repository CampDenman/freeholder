# Publish all six v1 distributable packages at the tagged platform version (C3.20).
name: Publish packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish aligned packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the exact successful main CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f status=success -f per_page=100 \
            | jq -e --arg sha "$GITHUB_SHA" \
              'any(.workflow_runs[]; .head_sha == $sha and .head_branch == "main" and .conclusion == "success")'
      - uses: ./.github/actions/setup-project
      - name: Verify the tag matches the platform version
        run: node scripts/release-packages.mjs --check-tag
      - name: Verify tagged release readiness
        env:
          RELEASE_SHA: ${{ github.sha }}
          IMAGE: ghcr.io/campdenman/freeholder
        run: node scripts/release-publication.mjs
      - name: Build and pack
        run: pnpm packages:build
      - name: Install the reviewed npm publisher
        run: npm install --global npm@12.2.0 --ignore-scripts
      - name: Publish or stage packed tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PUBLISH_MODE: ${{ vars.NPM_PUBLISH_MODE || 'publish' }}
        run: |
          set -euo pipefail
          case "$NPM_PUBLISH_MODE" in
            publish) publisher=(npm publish) ;;
            stage) publisher=(npm stage publish) ;;
            *) echo "NPM_PUBLISH_MODE must be publish or stage." >&2; exit 1 ;;
          esac
          # Trusted publishing uses this job's OIDC identity. First-package
          # staging may use a short-lived bootstrap credential until packages
          # exist and the owner can configure their trusted publishers.
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/freeholder-publisher.npmrc"
          trap 'rm -f -- "$NPM_CONFIG_USERCONFIG"' EXIT
          umask 077
          : > "$NPM_CONFIG_USERCONFIG"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          fi
          version=$(node -p 'require("./package.json").version')
          npm_tag=latest
          if [[ "$version" == *-* ]]; then npm_tag=next; fi
          mkdir -p /tmp/freeholder-release
          pnpm --filter create-freeholder --filter @freeholder/plugin-kit --filter @freeholder/sdk --filter @freeholder/templates --filter @freeholder/cli --filter freeholder-app pack --pack-destination /tmp/freeholder-release
          for tarball in /tmp/freeholder-release/*.tgz; do
            "${publisher[@]}" "$tarball" --access public --provenance --tag "$npm_tag"
          done
