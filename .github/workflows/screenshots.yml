# Capture customer-facing screenshots (booking, payment, portal) against a
# disposable database and publish them as a run artifact.
name: Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tests/browser/customer-screenshots.spec.ts
      - .github/workflows/screenshots.yml

permissions:
  contents: read

jobs:
  customer:
    name: Customer screens
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freeholder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/freeholder_test
      SCREENSHOTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/browser/customer-screenshots.spec.ts --config playwright.a11y.config.ts
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: customer-screenshots
          path: test-results/screenshots
          if-no-files-found: warn
