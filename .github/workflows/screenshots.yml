# Living screenshots (MASTER.md C3.29): capture every screen of the current app
# against a disposable database, then replace the `screenshots` branch with the
# result. Pull requests that touch the capture itself run it without publishing.
name: Screenshots

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - tests/browser/screenshots.spec.ts
      - scripts/screenshots-index.mjs
      - .github/workflows/screenshots.yml

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture every screen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freeholder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/freeholder_test
      SCREENSHOTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/browser/screenshots.spec.ts --config playwright.a11y.config.ts --retries 0
      - run: node scripts/screenshots-index.mjs test-results/screenshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: test-results/screenshots
          if-no-files-found: error

  publish:
    name: Publish to the screenshots branch
    needs: capture
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots
          path: screenshots
      - name: Replace the branch with this capture
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd screenshots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots of ${GITHUB_SHA::12}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:screenshots

  gallery:
    name: Update the gallery on freeholder.ai
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots
          path: screenshots
      # Credential-ready (C3.29): the job runs once the owner issues a scoped
      # agent key on the instance (media.* and cms.*, nothing else) and stores
      # it as the FREEHOLDER_GALLERY_TOKEN Actions secret, with the instance
      # base URL in the FREEHOLDER_GALLERY_URL variable. Until then the step
      # skips, so the pipeline stays green without a live credential.
      - name: Publish the gallery to the instance
        env:
          FREEHOLDER_GALLERY_URL: ${{ vars.FREEHOLDER_GALLERY_URL }}
          FREEHOLDER_GALLERY_TOKEN: ${{ secrets.FREEHOLDER_GALLERY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FREEHOLDER_GALLERY_URL}" ] || [ -z "${FREEHOLDER_GALLERY_TOKEN}" ]; then
            echo "FREEHOLDER_GALLERY_URL/TOKEN not configured; gallery update skipped."
            exit 0
          fi
          node scripts/screenshots-gallery.mjs screenshots
