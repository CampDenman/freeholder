# Publishing the container image is the one job CI genuinely owes this project:
# it is what makes every *other* deploy CI-free. A self-hoster runs
# `docker compose pull` and never needs a GitHub account, a runner, or a fork —
# which is the ownership promise (§1) applied to the deploy story.
#
# Deliberately never triggered by pull_request. A public repository that builds
# and pushes from a fork's code with registry credentials in scope is handing
# those credentials to whoever opens the pull request.
name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing (§39.3): the OIDC token *is* the identity, so there is
      # no long-lived signing key to leak, rotate, or lose. What a verifier
      # checks is that this workflow, in this repository, produced this digest.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The job-scoped token, not a personal one: it expires with the run
          # and can only reach this repository's packages.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # main publishes `edge`, never `latest`. Unreviewed main should not
          # become the default pull for every self-hoster; `latest` is earned
          # by a release tag.
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # linux/amd64 only for now: it is what DigitalOcean droplets and
          # Replit run. arm64 wants native runners rather than QEMU, which is
          # a follow-up rather than a twenty-minute emulated build.
          platforms: linux/amd64
          # A plain manifest: provenance attestations add an unknown/unknown
          # platform entry that some registry tooling reports as a broken image.
          provenance: false

      # §39.3: an auto-updater that runs unverified code is a supply-chain
      # backdoor with a friendly button. Nothing in §39 can be switched on
      # until an instance can prove an image came from here — so the proof is
      # published alongside the image from the first release, rather than
      # retrofitted once there are instances trusting it.
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless, §39.3)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Signed by digest, never by tag: a tag is a moving pointer, and a
          # signature over a pointer proves nothing about what it points at
          # tomorrow.
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "signed ${IMAGE}@${DIGEST}"

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: freeholder-sbom.spdx.json
          output-file: freeholder-sbom.spdx.json

      - name: Attest the SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: freeholder-sbom.spdx.json
          push-to-registry: true

      - name: What was published
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo "Signed keyless by \`${{ github.workflow_ref }}\`, with build provenance and an SPDX SBOM attached."
            echo ""
            echo "Verify before trusting it:"
            echo '```sh'
            echo "cosign verify ${IMAGE}@${{ steps.build.outputs.digest }} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://${IMAGE}@${{ steps.build.outputs.digest }} --repo ${{ github.repository }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
