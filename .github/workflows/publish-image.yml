# Publishing the container image is the one job CI genuinely owes this project:
# it is what makes every *other* deploy CI-free. A self-hoster runs
# `docker compose pull` and never needs a GitHub account, a runner, or a fork —
# which is the ownership promise (§1) applied to the deploy story.
#
# Deliberately never triggered by pull_request. A public repository that builds
# and pushes from a fork's code with registry credentials in scope is handing
# those credentials to whoever opens the pull request.
name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The job-scoped token, not a personal one: it expires with the run
          # and can only reach this repository's packages.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # main publishes `edge`, never `latest`. Unreviewed main should not
          # become the default pull for every self-hoster; `latest` is earned
          # by a release tag.
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # linux/amd64 only for now: it is what DigitalOcean droplets and
          # Replit run. arm64 wants native runners rather than QEMU, which is
          # a follow-up rather than a twenty-minute emulated build.
          platforms: linux/amd64
          # A plain manifest: provenance attestations add an unknown/unknown
          # platform entry that some registry tooling reports as a broken image.
          provenance: false

      - name: What was published
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
