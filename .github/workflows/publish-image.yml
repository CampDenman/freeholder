# Promote the exact candidate built after the complete CI gate. This workflow
# never rebuilds release source and never consumes artifacts from a PR run.
name: Publish image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    tags: ["v*"]

concurrency:
  group: publish-image-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve successful main CI
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      short_sha: ${{ steps.ci.outputs.short_sha }}
      run_id: ${{ steps.ci.outputs.run_id }}
    steps:
      - id: ci
        name: Select the exact successful CI run
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            sha="$WORKFLOW_RUN_SHA"
            run_id="$WORKFLOW_RUN_ID"
          else
            if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "Release tags must be vMAJOR.MINOR.PATCH with an optional SemVer prerelease" >&2
              exit 1
            fi
            sha="$GITHUB_SHA"
            runs=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$sha" -f event=push -f status=success -f per_page=100)
            run_id=$(jq -r \
              '[.workflow_runs[] | select(.head_branch == "main" and .conclusion == "success")][0].id // empty' \
              <<< "$runs")
            if [ -z "$run_id" ]; then
              echo "No successful main CI run exists for tag commit $sha" >&2
              exit 1
            fi
          fi
          if ! [[ "$sha" =~ ^[a-f0-9]{40}$ && "$run_id" =~ ^[0-9]+$ ]]; then
            echo "CI returned invalid immutable identifiers" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  publish:
    name: Promote, sign and attest
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - id: image
        name: Normalize the image name
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - name: Download dependency evidence from the same CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-audit-${{ needs.resolve.outputs.sha }}
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.run_id }}
      - name: Download the gated image candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-candidate-${{ needs.resolve.outputs.sha }}
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.run_id }}
      - name: Verify exact lockfile audit and candidate identity
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          node scripts/verify-dependency-attestation.mjs \
            artifacts/dependency-audit.json --max-age-hours=168
          jq -e \
            --arg sha "$EXPECTED_SHA" \
            --arg image "$IMAGE" \
            '.schema == "freeholder/image-candidate/v1" and
             .sha == $sha and .image == $image and
             (.digest | test("^sha256:[a-f0-9]{64}$"))' \
            artifacts/image-candidate.json >/dev/null
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=sha-${{ needs.resolve.outputs.short_sha }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
      - name: Verify candidate provenance and promote its immutable digest
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          digest=$(jq -r .digest artifacts/image-candidate.json)
          candidate="$IMAGE@$digest"
          gh attestation verify "oci://$candidate" --repo "$GITHUB_REPOSITORY"
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker buildx imagetools create --tag "$tag" "$candidate"
          done <<< "$TAGS"
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the promoted digest
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Generate an SPDX SBOM from the promoted image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ env.DIGEST }}
          format: spdx-json
          artifact-name: freeholder-sbom.spdx.json
          output-file: freeholder-sbom.spdx.json
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: freeholder-sbom.spdx.json
          push-to-registry: true
      - name: Publication summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Promoted after complete CI"
            echo '```'
            echo "$TAGS"
            echo "digest: $DIGEST"
            echo "source: ${{ needs.resolve.outputs.sha }}"
            echo "CI run: ${{ needs.resolve.outputs.run_id }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
