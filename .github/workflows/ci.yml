# Quality gates (MASTER.md §15). The SEO, i18n, money, and a11y gates join
# this file as the surfaces they check come into existence — each lands in
# the same PR as its first checkable surface.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freeholder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/freeholder_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: License headers (LICENSING.md boundary)
        run: pnpm license:check
      - name: Lint (architecture boundaries, service-layer and money gates)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      # A recipe whose image does not build is a recipe nobody can use, and
      # this repo has no Docker on the development machine — so CI is where
      # that claim gets checked. First half of §18's recipe validation matrix.
      - name: Deploy recipe — the image builds
        run: docker build --tag freeholder:ci .
      - name: Deploy recipe — the image starts and serves
        run: |
          docker run -d --name freeholder-ci -p 3000:3000             -e SESSION_SECRET=ci-only-secret-that-is-32-chars-long             -e APP_URL=http://localhost:3000             freeholder:ci
          # No DATABASE_URL on purpose: the container must boot and answer
          # before it can reach a database, or a cold start is a crash loop.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "container answered with HTTP $code after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "container never answered"; docker logs freeholder-ci; exit 1
      - name: Changelog gate (§15.6)
        if: github.event_name == 'pull_request'
        run: node scripts/changelog-gate.mjs origin/${{ github.base_ref }}
