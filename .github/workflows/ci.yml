# Independent required jobs keep first feedback below the owned CI SLO while
# the final release gate still represents every test and deploy proof.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SESSION_SECRET: ci-build-only-not-a-real-secret-0000000000

jobs:
  application:
    name: Application gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: pnpm plan:check
      - run: pnpm license:check
      - run: pnpm workflow:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Published package artifact integrity
        run: pnpm packages:verify
      - run: pnpm build
      - run: pnpm artifact:check
      - name: Schema compatibility
        if: github.event_name == 'pull_request'
        run: node scripts/schema-compat-gate.mjs origin/${{ github.base_ref }}
      - name: Changelog coverage
        if: github.event_name == 'pull_request'
        run: node scripts/changelog-gate.mjs origin/${{ github.base_ref }}

  security:
    name: Security and dependency evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Dependency change review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
      - name: Secret scan
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          version: 3.97.4
          extra_args: --results=verified,unknown --fail-on-scan-errors
      # Run repository scanners before executing any dependency lifecycle from
      # a pull request. This job has no write permission in either phase.
      - uses: ./.github/actions/setup-project
      - name: Live dependency audit
        run: node scripts/dependency-audit.mjs --write-attestation=artifacts/dependency-audit.json
      - name: Preserve lockfile-keyed audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ github.sha }}
          path: artifacts/dependency-audit.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  tests:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freeholder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/freeholder_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}

  ownership:
    name: Backup, restore and export drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freeholder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/freeholder_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: pnpm ownership:drill

  browser:
    name: Browser accessibility and journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freeholder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/freeholder_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser

  deployment:
    name: Image, recipes, public gates and upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freeholder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/freeholder_test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      CI_IMAGE: freeholder:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Build the release image
        run: docker build --tag freeholder:ci .
      - name: Prove dependency failure separates liveness from readiness
        run: |
          cleanup() { docker rm -f freeholder-outage >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name freeholder-outage --network host \
            -e PORT=3001 \
            -e SESSION_SECRET=ci-only-secret-that-is-32-chars-long \
            -e APP_URL=http://localhost:3001 \
            -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:59999/unavailable \
            freeholder:ci
          live=""
          for _ in $(seq 1 60); do
            live=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/health/live || true)
            [ "$live" = "200" ] && break
            sleep 1
          done
          [ "$live" = "200" ] || {
            docker logs freeholder-outage
            echo "liveness answered $live during dependency failure, expected 200"
            exit 1
          }
          ready=$(curl --max-time 8 -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/health || true)
          [ "$ready" = "503" ] || {
            docker logs freeholder-outage
            echo "readiness answered $ready during dependency failure, expected 503"
            exit 1
          }
      - name: Prove the image boots its real request graph
        run: |
          docker run -d --name freeholder-ci --network host \
            -e SESSION_SECRET=ci-only-secret-that-is-32-chars-long \
            -e APP_URL=http://localhost:3000 \
            -e DATABASE_URL="$DATABASE_URL" freeholder:ci
          code=""
          for _ in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$code" != "200" ]; then
            docker logs freeholder-ci
            echo "readiness answered $code, expected 200"
            exit 1
          fi
          health=$(curl -fsS http://localhost:3000/api/health)
          node -e '
            const h = JSON.parse(process.argv[1]);
            if (!h.ok || !h.modules || !h.services || !h.jobs?.ready) {
              console.error("incomplete boot evidence", h); process.exit(1);
            }
            console.log(`booted ${h.modules} modules, ${h.services} services, ${h.listeners} listeners; worker age ${h.jobs.heartbeatAgeSeconds}s`);
          ' "$health"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/setup)" = "200"
          docker rm -f freeholder-ci >/dev/null
      - name: Start S3-compatible recipe storage
        run: |
          docker run -d --name freeholder-minio --network host \
            -e MINIO_ROOT_USER=freeholder-ci \
            -e MINIO_ROOT_PASSWORD=freeholder-ci-secret \
            minio/minio:RELEASE.2025-07-23T15-54-02Z@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0 server /data --address :9000
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-07-21T05-28-08Z@sha256:fb8f773eac8ef9d6da0486d5dec2f42f219358bcb8de579d1623d518c9ebd4cc -c \
            'mc alias set local http://127.0.0.1:9000 freeholder-ci freeholder-ci-secret && mc mb --ignore-existing local/freeholder-recipe-gate'
      - run: bash scripts/recipe-matrix.sh
      - run: bash scripts/public-gates.sh
      - name: Registry login for the previous release
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upgrade from the previous release
        run: bash scripts/upgrade-gate.sh
        env:
          PREVIOUS_IMAGE: ghcr.io/${{ github.repository }}:edge
          CURRENT_IMAGE: freeholder:ci

  release-gate:
    # Keep the existing protected-branch context while changing its meaning
    # from one serial job to the fan-in of every independent required job.
    name: checks
    needs: [application, security, codeql, tests, ownership, browser, deployment]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Every required gate passed for $GITHUB_SHA"

  candidate-image:
    name: Build attested release candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: image
        name: Normalize the image name
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:candidate-${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest candidate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record the exact promotable artifact
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p artifacts
          jq -n \
            --arg schema "freeholder/image-candidate/v1" \
            --arg sha "$GITHUB_SHA" \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            '{schema: $schema, sha: $sha, image: $image, digest: $digest}' \
            > artifacts/image-candidate.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-candidate-${{ github.sha }}
          path: artifacts/image-candidate.json
          if-no-files-found: error
          retention-days: 30
