# Quality gates (MASTER.md §15). The SEO, i18n, money, and a11y gates join
# this file as the surfaces they check come into existence — each lands in
# the same PR as its first checkable surface.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The upgrade gate (§39.9) pulls the previously released image to prove
      # an owner's instance can actually get from that release to this one.
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freeholder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/freeholder_test
      # `next build` prerenders pages, and prerendering calls env(), which
      # refuses to resolve in production without a session secret. A build is
      # not a running instance and this value signs nothing: it exists so the
      # Build step can render, exactly as vitest.config.ts supplies a
      # deterministic one because CI has no real secret to give.
      SESSION_SECRET: ci-build-only-not-a-real-secret-0000000000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Product plan consistency (MASTER.md §43)
        run: pnpm plan:check
      - name: Apache-2.0 licensing consistency
        run: pnpm license:check
      # §36 lists dependency audit among the v1.0 security gates. High and
      # critical findings are absolute failures. A lower-severity finding is
      # also a failure unless SECURITY.md's owned, expiring exception contract
      # has been recorded path-for-path in the checked-in ledger.
      - name: Dependency audit (§36)
        run: pnpm dependency:audit
      - name: Lint (architecture boundaries, service-layer and money gates)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      # C1.23: a backup is not evidence until it restores. This uses the
      # disposable CI database only, restores pg_dump into a random scratch
      # database, compares every application-owned table and then generates
      # the secret-safe logical export and media manifest from the restore.
      - name: Ownership backup, restore and export drill (C1.23)
        run: pnpm ownership:drill
      - name: Build
        run: pnpm build
      - name: Standalone artifact boundary
        run: pnpm artifact:check
      # C1.21/C1.22 are deliberately separate from the jsdom unit helpers:
      # Chromium supplies real layout, focus, navigation and Server Action
      # behaviour. The serial suites reset only the disposable CI database.
      - name: Real-browser accessibility and journey gates (§15.7, C1.21-C1.22)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser
      # A recipe whose image does not build is a recipe nobody can use, and
      # this repo has no Docker on the development machine — so CI is where
      # that claim gets checked. First half of §18's recipe validation matrix.
      - name: Deploy recipe — the image builds
        run: docker build --tag freeholder:ci .
      - name: Deploy recipe — the image serves a real request
        run: |
          # --network host so the container reaches the Postgres service the
          # rest of this job already migrated. Asserting 200 rather than "some
          # response": the first version of this step accepted any status and
          # passed on a 500, which is a green tick for a broken image.
          docker run -d --name freeholder-ci --network host -e SESSION_SECRET=ci-only-secret-that-is-32-chars-long -e APP_URL=http://localhost:3000 -e DATABASE_URL="$DATABASE_URL" freeholder:ci
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$code" != "200" ]; then
            echo "home page answered $code, expected 200"; docker logs freeholder-ci; exit 1
          fi
          setup=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/setup || true)
          if [ "$setup" != "200" ]; then
            echo "/setup answered $setup, expected 200"; docker logs freeholder-ci; exit 1
          fi
          echo "image serves / and /setup with 200"
          # The modules must be booted *in the graph serving requests*, not
          # merely in instrumentation's. They were not, for three phases, and
          # nothing failed — services are called as objects rather than looked
          # up, so an empty registry is invisible until a module listens for an
          # event. This asserts the wiring rather than trusting it.
          health=$(curl -s http://localhost:3000/api/health)
          echo "health: $health"
          echo "$health" | grep -q '"ok":true' || { echo "platform did not boot"; docker logs freeholder-ci; exit 1; }
          node -e '
            const h = JSON.parse(process.argv[1]);
            if (!h.modules || !h.services) {
              console.error("booted with nothing wired:", h); process.exit(1);
            }
            console.log(`booted ${h.modules} modules, ${h.services} services, ${h.listeners} listeners`);
          ' "$health"
          docker rm -f freeholder-ci >/dev/null
      - name: Tier-1 recipe runtime matrix (Postgres + MinIO + Doctor)
        run: |
          docker run -d --name freeholder-minio --network host \
            -e MINIO_ROOT_USER=freeholder-ci \
            -e MINIO_ROOT_PASSWORD=freeholder-ci-secret \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data --address :9000
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-07-21T05-28-08Z -c \
            'mc alias set local http://127.0.0.1:9000 freeholder-ci freeholder-ci-secret && mc mb --ignore-existing local/freeholder-recipe-gate'
          bash scripts/recipe-matrix.sh
        env:
          CI_IMAGE: freeholder:ci
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      # §15.2, against the seeded demo site inside the built image.
      # The doctrine in §5 is "enforced structurally" — this is the structure.
      - name: SEO gate (§15.2)
        run: bash scripts/public-gates.sh
        env:
          CI_IMAGE: freeholder:ci
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      # §39.5: rollback is an image swap only while release N's schema is
      # still readable by N-1. This refuses the statements known to break that,
      # unless somebody wrote down that they are doing it deliberately.
      - name: Schema-compatibility gate (§39.5)
        if: github.event_name == 'pull_request'
        run: node scripts/schema-compat-gate.mjs origin/${{ github.base_ref }}
      # The gate that makes auto-update safe to leave on (§39.9). Everything
      # else in §39 — signatures, preflight, snapshots — reduces the blast
      # radius of a bad upgrade. This is the only part that checks an upgrade
      # actually works, on real data, against the release people are running.
      # Read-only, and only so the previously released image can be pulled.
      # A pull request from a fork gets a token that cannot reach packages; the
      # gate notices and skips with a warning rather than failing somebody
      # else's contribution for a permission they were never going to have.
      - name: Registry login (for the previous release)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upgrade gate (§39.9)
        run: bash scripts/upgrade-gate.sh
        env:
          PREVIOUS_IMAGE: ghcr.io/${{ github.repository }}:edge
          CURRENT_IMAGE: freeholder:ci
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Changelog gate (§15.6)
        if: github.event_name == 'pull_request'
        run: node scripts/changelog-gate.mjs origin/${{ github.base_ref }}
