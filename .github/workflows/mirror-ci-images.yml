# Mirror the third-party images CI depends on into this repository's own
# registry.
#
# CI used to pull its S3-compatible storage straight from quay.io. In September
# 2026 MinIO closed public distribution: `quay.io/minio/minio` answers 401 to an
# anonymous manifest read, `minio/minio` on Docker Hub answers 401 even with a
# valid anonymous pull token, and `bitnami/minio` was emptied of every tag. A
# green build stopped being reproducible because of somebody else's licensing
# decision, which is the failure this workflow exists to prevent recurring.
#
# So CI reads from ghcr.io, and the only place that touches an upstream registry
# is this workflow. Mirroring is a deliberate act with a commit behind it rather
# than something every build does sixty times a day.
name: Mirror CI images

on:
  push:
    paths: [".github/workflows/mirror-ci-images.yml"]
  workflow_dispatch:

concurrency:
  group: mirror-ci-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror into ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Copied by digest, not by tag, and `imagetools create` copies the whole
      # manifest list rather than one architecture. The destination tag names
      # the upstream version so the mirror is auditable from the tag alone.
      - name: Mirror the S3-compatible storage used by the recipe gate
        env:
          SOURCE: docker.io/adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
          OWNER: ${{ github.repository_owner }}
        run: |
          # Lower-cased because ghcr.io rejects a mixed-case repository name and
          # `github.repository_owner` is spelled the way the account is.
          target="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/freeholder-ci-s3:5.2.3"
          docker buildx imagetools create --tag "$target" "$SOURCE"
          echo "Mirrored $SOURCE to $target"
          docker buildx imagetools inspect "$target" --format '{{ .Manifest.Digest }}'
