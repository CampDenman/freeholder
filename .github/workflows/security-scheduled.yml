# Registry advisories and secret verification can change without a code change,
# so the merge-time scan is not a substitute for a fresh scheduled one.
name: Scheduled security scan

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Fresh dependency audit
        run: pnpm dependency:audit -- --write-attestation=artifacts/dependency-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-dependency-audit-${{ github.run_id }}
          path: artifacts/dependency-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Full-history secret scan
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          base: ""
          head: HEAD
          version: 3.97.4
          extra_args: --results=verified,unknown --fail-on-scan-errors
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
