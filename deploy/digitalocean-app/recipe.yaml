name: digitalocean-app
schema: freeholder-deploy-recipe/v1
tier: 1
maintainers: ["@tonyaly"]
freeholder_min_version: "0.0.0"
provides:
  database: digitalocean-managed-postgres
  storage: spaces-s3
  jobs: worker-component
  cron: app-platform-job
estimated_monthly_cost_usd: { min: 17, typical: 32 }
limits:
  - "Media MUST live in Spaces"
  - "No persistent disk — storage adapter is s3"
artifacts:
  - deploy/digitalocean-app/infra/app.yaml
required_environment:
  - SESSION_SECRET
  - CREDENTIAL_KEY
  - S3_BUCKET
  - S3_ENDPOINT
  - S3_REGION
  - S3_ACCESS_KEY_ID
  - S3_SECRET_ACCESS_KEY
operations:
  install: "node scripts/prepare-do-app-spec.mjs && doctl apps create --spec .freeholder-do-app.yaml"
  verify: "pnpm doctor --url $FREEHOLDER_URL --email $FREEHOLDER_EMAIL --password $FREEHOLDER_PASSWORD"
  backup: "pg_dump --format=custom --no-owner --no-privileges --file freeholder.dump $DATABASE_URL"
  restore: "pg_restore --no-owner --no-privileges --dbname $DATABASE_URL freeholder.dump"
  migrate-in: "pg_restore --no-owner --no-privileges --dbname $DATABASE_URL freeholder.dump && pnpm media:transfer -- --manifest ownership-export/media-manifest.json"
  migrate-out: "pg_dump --format=custom --no-owner --no-privileges --file freeholder.dump $DATABASE_URL && pnpm ownership:export -- --output ownership-export && pnpm media:transfer -- --manifest ownership-export/media-manifest.json"
  update: "node scripts/prepare-do-app-spec.mjs --output .freeholder-do-app-update.yaml && doctl apps update $DIGITALOCEAN_APP_ID --spec .freeholder-do-app-update.yaml"
  rollback: "doctl apps update $DIGITALOCEAN_APP_ID --spec $PREVIOUS_FREEHOLDER_APP_SPEC"
update:
  strategy: image-swap
  rollback: redeploy the previous spec image tag
tested_on: "2026-08-25"
