# One-command droplet bootstrap (MASTER.md 21b). Everything a fresh Ubuntu box
# needs to run the compose stack -- nothing Freeholder-specific beyond the
# directory, because the release itself arrives afterwards.
#
# ASCII ONLY, deliberately. An earlier version of this file contained an em
# dash and cloud-init rejected the whole document with "unacceptable character
# #x0080": user-data reaches the parser without a UTF-8 decode, so any byte
# above 0x7F discards every directive here. It fails *silently* -- cloud-init
# still reports "status: done", and you find out by discovering no Docker on a
# machine that claims to have finished. tests/core/deploy-recipe.test.ts keeps
# this file ASCII so that cannot happen again.
package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - ufw
  - unattended-upgrades

write_files:
  - path: /etc/freeholder/README
    content: |
      Freeholder lives in /opt/freeholder.
        compose.yml   the stack        .env  secrets (chmod 600)
      Deploy:  cd /opt/freeholder && docker compose pull && docker compose up -d
      Logs:    docker compose logs -f app
      Backup:  /opt/freeholder/backup.sh   (nightly via cron)

runcmd:
  # Only 22, 80 and 443. Postgres is reachable from the app container and
  # nowhere else; it is never published to the host.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl enable --now docker
  - mkdir -p /opt/freeholder
  - chmod 750 /opt/freeholder
  # Security updates apply themselves; an unattended box is worse than none.
  - systemctl enable --now unattended-upgrades
