name: docker-selfhost
schema: freeholder-deploy-recipe/v1
tier: 1
maintainers: ["@tonyaly"]
freeholder_min_version: "0.0.0"
provides:
  database: compose-postgres
  storage: minio-or-s3
  jobs: web-process
  cron: host-cron
estimated_monthly_cost_usd: { min: 0, typical: 20 }
limits:
  - "Production media MUST leave the compose volume for real S3/R2/Spaces"
  - "MinIO is the local-dev profile only"
artifacts:
  - deploy/docker-selfhost/infra/compose.yml
required_environment:
  - SESSION_SECRET
  - CREDENTIAL_KEY
  - APP_URL
  - S3_BUCKET
  - S3_ENDPOINT
  - S3_REGION
  - S3_ACCESS_KEY_ID
  - S3_SECRET_ACCESS_KEY
operations:
  install: "docker compose -f deploy/docker-selfhost/infra/compose.yml up -d"
  verify: "pnpm doctor --url $FREEHOLDER_URL --email $FREEHOLDER_EMAIL --password $FREEHOLDER_PASSWORD"
  backup: "docker compose -f deploy/docker-selfhost/infra/compose.yml exec -T db pg_dump --format=custom --no-owner --no-privileges -U freeholder freeholder > freeholder.dump"
  restore: "docker compose -f deploy/docker-selfhost/infra/compose.yml exec -T db pg_restore --no-owner --no-privileges -U freeholder -d freeholder < freeholder.dump"
  migrate-in: "docker compose -f deploy/docker-selfhost/infra/compose.yml exec -T db pg_restore --no-owner --no-privileges -U freeholder -d freeholder < freeholder.dump && pnpm media:transfer -- --manifest ownership-export/media-manifest.json"
  migrate-out: "docker compose -f deploy/docker-selfhost/infra/compose.yml exec -T db pg_dump --format=custom --no-owner --no-privileges -U freeholder freeholder > freeholder.dump && pnpm ownership:export -- --output ownership-export && pnpm media:transfer -- --manifest ownership-export/media-manifest.json"
  update: "docker compose -f deploy/docker-selfhost/infra/compose.yml pull && docker compose -f deploy/docker-selfhost/infra/compose.yml up -d"
  rollback: "FREEHOLDER_IMAGE=$PREVIOUS_FREEHOLDER_IMAGE docker compose -f deploy/docker-selfhost/infra/compose.yml up -d"
update:
  strategy: image-swap
  rollback: compose pull the previous tag
tested_on: "2026-08-25"
