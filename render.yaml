services:
  - type: web
    name: freeholder-web
    runtime: image
    plan: starter
    image:
      url: ghcr.io/campdenman/freeholder:edge
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: freeholder-db
          property: connectionString
      - key: FREEHOLDER_STORAGE
        value: s3
      - key: APP_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CREDENTIAL_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: freeholder-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: freeholder
    user: freeholder
    ipAllowList: []
