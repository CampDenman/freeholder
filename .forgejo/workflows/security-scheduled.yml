#
# Forgejo twin of .github/workflows/security-scheduled.yml, reduced to the
# parts that can run off GitHub. Registry advisories change without a code
# change, so a scheduled scan is not redundant with the merge-time one.
#
# Absent from this twin, deliberately: github/codeql-action (init and analyze)
# is GitHub-proprietary and has no Forgejo equivalent, and
# trufflesecurity/trufflehog is a GitHub-hosted action whose availability on
# this instance is unverified. The GitHub workflow still runs both. See
# .forgejo/README.md.
name: Scheduled security scan (Forgejo)

on:
  schedule:
    - cron: "47 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: https://data.forgejo.org/actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Activate the pinned pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
      - name: Install the reviewed dependency graph
        run: pnpm install --frozen-lockfile
      - name: Fresh dependency audit
        run: pnpm dependency:audit -- --write-attestation=artifacts/dependency-audit.json
      - name: Fresh customer app dependency audit
        working-directory: apps/mobile
        run: npm audit --package-lock-only --audit-level=moderate
      - name: Show the audit attestation
        run: |
          test -s artifacts/dependency-audit.json
          node -e "const a=require('./artifacts/dependency-audit.json');console.log(JSON.stringify(a).slice(0,2000))"
