# Keep demo.freeholder.ai on the latest code, automatically.
#
# Tony's standing rule, 2026-11-19: "the demo SHOULD ALWAYS CARRY THE LATEST
# CODE". Nothing enforced it before this file. The only deploy path was
# deploy-production.yml, which is `workflow_dispatch` only and requires a human
# to type DEPLOY PRODUCTION, so the demo moved exactly as often as someone
# remembered. Measured that day: demo.freeholder.ai served 0.2.0-beta.6 while
# freeholder.ai served 0.2.0-beta.3, and neither tracked `main` by anything but
# memory.
#
# Like deploy-production.yml, this file lives on the private forge ON PURPOSE.
# Do not copy it to .github/workflows: a public repository's hosted runner
# would then hold the production SSH key, and the host address would pass
# through GitHub. Host, key and known_hosts are secrets and are not in here.
#
# THE DEMO IS NOT PRODUCTION, AND THIS MUST NEVER DEPLOY PRODUCTION.
# Both instances live on the same droplet and are distinguished only by
# DEPLOY_DIR. `deployTargetFromEnv` (scripts/deploy-droplet.mjs:139) DEFAULTS
# DEPLOY_DIR to /opt/freeholder, which is production's directory, so an empty
# demo secret would silently deploy the marketing site from this automatic,
# unconfirmed workflow. The guard below refuses to run unless the demo
# directory is set AND differs from that default. Do not remove it.
#
# Production stays manual and confirmed. This file does not touch it.
name: Deploy demo

on:
  push:
    branches: [main]
  # A safety net for the race below: a push whose image was not published yet
  # is picked up by the next scheduled run rather than waiting for another push.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      revision:
        description: Commit SHA, sha-<12>, or a ghcr.io digest already published by main CI. Defaults to main's head.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: freeholder-demo
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the latest published image to the demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: https://data.forgejo.org/actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # The whole point of the file: refuse to be production.
      - name: Refuse to deploy anything but the demo directory
        env:
          DEMO_DIR: ${{ secrets.FREEHOLDER_DEMO_DEPLOY_DIR }}
          DEMO_HEALTH_URL: ${{ secrets.FREEHOLDER_DEMO_DEPLOY_HEALTH_URL }}
        run: |
          test -n "$DEMO_DIR" || { echo "FREEHOLDER_DEMO_DEPLOY_DIR is unset; refusing to fall back to production's /opt/freeholder" >&2; exit 1; }
          test "$DEMO_DIR" != "/opt/freeholder" || { echo "FREEHOLDER_DEMO_DEPLOY_DIR is production's directory; refusing" >&2; exit 1; }
          test -n "$DEMO_HEALTH_URL" || { echo "FREEHOLDER_DEMO_DEPLOY_HEALTH_URL is unset; refusing to deploy without a health check" >&2; exit 1; }

      - name: Resolve the revision to deploy
        id: revision
        env:
          REQUESTED: ${{ inputs.revision }}
        run: |
          revision="${REQUESTED:-$(git rev-parse HEAD)}"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "deploying $revision"

      - name: Configure the dedicated deploy identity
        env:
          DEPLOY_KEY: ${{ secrets.FREEHOLDER_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.FREEHOLDER_DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/freeholder_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/freeholder_deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.FREEHOLDER_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FREEHOLDER_DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.FREEHOLDER_DEMO_DEPLOY_DIR }}
          DEPLOY_HEALTH_URL: ${{ secrets.FREEHOLDER_DEMO_DEPLOY_HEALTH_URL }}
          FREEHOLDER_GH_TOKEN: ${{ secrets.FREEHOLDER_GH_TOKEN }}
          REVISION: ${{ steps.revision.outputs.revision }}
        run: |
          export DEPLOY_SSH_KEY_PATH="$HOME/.ssh/freeholder_deploy"
          export DEPLOY_KNOWN_HOSTS_FILE="$HOME/.ssh/known_hosts"
          node scripts/deploy-droplet.mjs --revision "$REVISION"
