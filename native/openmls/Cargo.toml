[package]
name = "freeholder-openmls"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { version = "=0.9.0", features = ["js"] }
openmls_traits = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
tls_codec = { version = "=0.5.0", features = ["derive", "serde", "mls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", features = ["pkcs8"] }
wasm-bindgen = "=0.2.130"
getrandom_02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "=0.4.3", features = ["wasm_js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
