packages:
  - "packages/*"

# esbuild ships prebuilt binaries as optional deps; its postinstall script
# races with itself on Windows when multiple versions install concurrently.
# sharp needs its build script to wire up libvips for next/image.
allowBuilds:
  esbuild: false
  sharp: true

# Transitive dependencies pinned forward past a published advisory (§36:
# "dependency audit in CI"). These exist because `pnpm audit --audit-level
# high` is a CI gate, and the honest way past a red gate is to take the patch,
# not to lower the bar until the gate goes quiet.
#
# Each entry is a floor, not a pin — a direct dependency asking for something
# newer still wins. Remove an entry once every dependency has caught up on its
# own; the audit gate is what will tell you it is safe to.
overrides:
  # CVE-2026-33327/33328/35590 — inherited libvips vulnerabilities. sharp is
  # also a *direct* dependency now (core/media generates renditions), and Next
  # pulls its own older copy for next/image; this drags that one forward too.
  #
  # The specifier must match package.json's exactly. An override rewrites the
  # specifier of a direct dependency as well as a transitive one, so a broader
  # range here (">=0.35.0" against a manifest saying "^0.35.3") makes the
  # lockfile disagree with package.json and fails --frozen-lockfile in CI.
  sharp: "^0.35.3"
  # GHSA-r28c-9q8g-f849 and the sourceMappingURL path traversal: arbitrary file
  # read via an attacker-controlled source map comment.
  postcss: ">=8.5.18"
  # DoS via unbounded brace expansion. Only reachable through dev tooling
  # today, overridden anyway because the fix is a patch version.
  brace-expansion: ">=5.0.8"
